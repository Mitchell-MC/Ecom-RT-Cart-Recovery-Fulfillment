name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/terraform/**"

permissions:
  id-token: write # required for azure/login OIDC federated credential auth
  contents: read
  pull-requests: write # to post the plan as a PR comment

jobs:
  plan:
    strategy:
      matrix:
        target: [dev, staging]
    runs-on: ubuntu-latest
    environment: ${{ matrix.target }} # pulls this environment's AZURE_*/DATABRICKS_HOST vars
    defaults:
      run:
        working-directory: infra/terraform/env/${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"

      - run: terraform fmt -check -recursive ../../
        # Fails fast on formatting drift for the whole infra/terraform tree, not just this target

      - name: terraform init
        run: |
          terraform init \
            -backend-config="storage_account_name=stecomtfstate" \
            -backend-config="container_name=tfstate" \
            -backend-config="resource_group_name=rg-ecom-tfstate" \
            -backend-config="key=${{ matrix.target }}.tfstate"
        env:
          ARM_USE_OIDC: "true"

      - name: terraform plan
        id: plan
        run: |
          terraform plan -no-color -input=false \
            -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -var="databricks_workspace_url=${{ vars.DATABRICKS_HOST }}" \
            -var="storage_suffix=${{ vars.STORAGE_SUFFIX }}" \
            -var="github_repo=${{ github.repository }}" \
            2>&1 | tee plan_output.txt
        env:
          ARM_USE_OIDC: "true"
          DATABRICKS_AUTH_TYPE: azure-cli

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('infra/terraform/env/${{ matrix.target }}/plan_output.txt', 'utf8');
            const truncated = output.length > 60000 ? output.slice(-60000) : output;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform Plan — \`${{ matrix.target }}\`\n<details><summary>Show plan</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n</details>`
            });
