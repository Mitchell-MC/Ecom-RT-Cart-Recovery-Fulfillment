# Databricks Asset Bundle root. Deploys job/pipeline *definitions* -- the platform (catalog,
# storage, cluster policies, identity) is Terraform's job, not this file's; see
# infra/terraform/README.md for why that split exists.
#
# Usage:
#   databricks bundle deploy -t dev
#   databricks bundle run   -t dev main_pipeline
bundle:
  name: ecom-signal-platform

include:
  - resources/*.yml

sync:
  include:
    - ../../src/**

variables:
  environment:
    description: dev | staging, becomes the `env` job parameter every task reads via config.py
  catalog:
    description: Unity Catalog catalog name (must match infra/terraform output `catalog_name`)
  storage_suffix:
    description: Storage-account suffix (must match the Terraform `storage_suffix` var)
  job_cluster_policy_id:
    description: From `terraform output job_policy_id` in infra/terraform/env/<target>
  streaming_cluster_policy_id:
    description: From `terraform output streaming_policy_id`
  sql_warehouse_id:
    description: From `terraform output sql_warehouse_id`; used by the SQL maintenance job
  node_type_id:
    default: Standard_DS3_v2
  spark_version:
    default: 15.4.x-scala2.12
  pipeline_service_principal_app_id:
    description: From `terraform output pipeline_application_id`; owns staging job runs
  secret_scope:
    default: ecom
    description: >-
      Databricks secret scope holding `slack_webhook_url`, injected into job clusters as
      SLACK_WEBHOOK_URL. Create with:
      `databricks secrets create-scope ecom && databricks secrets put-secret ecom slack_webhook_url`.
      Jobs run fine without it -- alerting.py skips the Slack post and logs instead -- so a
      missing secret degrades the alert, it does not break the pipeline.
  alert_email:
    description: >-
      Address receiving on_failure / SLA-breach notifications for every job. Required: a job
      whose failure notifies nobody is indistinguishable from a job that succeeded, which is
      how a pipeline stays broken for days (see docs/runbook.md).

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${env.DATABRICKS_HOST}
    variables:
      environment: dev
      catalog: ecom_dev
      storage_suffix: dv01

  staging:
    mode: production
    workspace:
      host: ${env.DATABRICKS_HOST}
    run_as:
      service_principal_name: ${var.pipeline_service_principal_app_id}
    variables:
      environment: staging
      catalog: ecom_staging
      storage_suffix: sg01
